<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Обучение AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* === BASE === */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --dark:  #0f1a1f;
      --white: #ffffff;
      --blue:  #29A9E1;
      --red:   #E13329;
    }

    html, body { height: 100%; }

    body {
      background-color: #0f1a1f;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button { font-family: 'Inter', sans-serif; }

    /* === SCREENS === */
    .screen {
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
    }
    .screen-home,
    .screen-result {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    .screen-game {
      display: flex;
      flex-direction: column;
      padding: 16px 20px 24px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* === HOME (MODULE SELECT) === */
    .home-inner {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .start-hero {
      display: block;
      width: 100%;
      max-width: 260px;
      height: auto;
      margin: 0 auto 24px;
      animation: gentleFloat 6s ease-in-out infinite;
      filter: drop-shadow(0 0 32px rgba(41, 169, 225, 0.3));
    }
    .screen-home .start-hero { max-width: 170px; margin-bottom: 16px; }
    .home-inner h1 {
      font-weight: 900;
      font-size: 34px;
      line-height: 1.1;
      color: #ffffff;
      margin: 0 0 10px;
      letter-spacing: -0.02em;
    }
    .home-inner p {
      font-weight: 500;
      font-size: 16px;
      line-height: 1.45;
      color: rgba(255,255,255,0.7);
      margin: 0 0 28px;
    }
    .module-list { display: flex; flex-direction: column; }
    .module-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 100%;
      background: #ffffff;
      border: 3px solid #0f1a1f;
      box-shadow: 6px 6px 0 #0f1a1f;
      border-radius: 4px;
      padding: 20px;
      margin-bottom: 16px;
      cursor: pointer;
      text-align: left;
      font-family: 'Inter', sans-serif;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .module-card:active {
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0 #0f1a1f;
    }
    .module-badge {
      display: inline-block;
      background: #29A9E1;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      border-radius: 2px;
      margin-bottom: 12px;
    }
    .module-title {
      font-size: 22px;
      font-weight: 800;
      color: #0f1a1f;
      margin-bottom: 6px;
      line-height: 1.15;
    }
    .module-desc {
      font-size: 14px;
      font-weight: 500;
      color: rgba(15,26,31,0.6);
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .module-meta {
      font-size: 12px;
      font-weight: 700;
      color: #29A9E1;
      letter-spacing: 0.02em;
    }

    /* === BACK LINK === */
    .back-link {
      align-self: flex-start;
      background: none;
      border: none;
      color: rgba(255,255,255,0.55);
      font-size: 14px;
      font-weight: 600;
      padding: 4px 0;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .back-link:active { color: #ffffff; }

    /* === PROGRESS === */
    .progress-track {
      height: 6px;
      background: rgba(255,255,255,0.15);
      border-radius: 0;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #29A9E1;
      transition: width 0.4s ease;
    }
    .progress-label {
      font-weight: 500;
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      text-align: right;
      margin-bottom: 20px;
    }

    /* === CARD === */
    .card {
      background: #ffffff;
      border: 3px solid #0f1a1f;
      box-shadow: 8px 8px 0 #0f1a1f;
      border-radius: 4px;
      padding: 28px 24px;
      margin-bottom: 24px;
    }
    .task-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .task-badge {
      display: inline-block;
      background: #29A9E1;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      border-radius: 2px;
    }
    .task-icon {
      font-size: 30px;
      line-height: 1;
    }
    .task-quote {
      border-left: 4px solid #29A9E1;
      background: rgba(41,169,225,0.08);
      padding: 12px 14px;
      margin-bottom: 16px;
      border-radius: 0 4px 4px 0;
    }
    .quote-label {
      display: block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #29A9E1;
      margin-bottom: 4px;
    }
    .quote-text {
      display: block;
      font-size: 16px;
      font-weight: 600;
      font-style: italic;
      color: #0f1a1f;
      line-height: 1.45;
    }
    .task-text {
      font-weight: 600;
      font-size: 20px;
      line-height: 1.5;
      color: #0f1a1f;
      margin: 0;
    }

    /* === CHOICES === */
    .choices {
      display: flex;
      flex-direction: column;
    }
    .choice-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 56px;
      padding: 18px 20px;
      background: #ffffff;
      border: 3px solid #0f1a1f;
      box-shadow: 4px 4px 0 #0f1a1f;
      border-radius: 4px;
      font-size: 18px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      color: #0f1a1f;
      margin-bottom: 12px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s, background 0.15s, color 0.15s, border-color 0.15s;
      text-align: left;
    }
    .choice-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #0f1a1f;
    }
    .choice-btn--letter { align-items: flex-start; }
    .choice-emoji {
      font-size: 24px;
      line-height: 1;
      flex-shrink: 0;
    }
    .choice-letter {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1a1f;
      color: #ffffff;
      font-weight: 800;
      font-size: 14px;
      border-radius: 3px;
      margin-top: 1px;
    }
    .choice-body {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      line-height: 1.2;
    }
    .choice-text {
      font-size: 18px;
      font-weight: 700;
    }
    .choice-btn--letter .choice-text {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.35;
    }
    .choice-hint {
      font-size: 12px;
      font-weight: 500;
      opacity: 0.55;
      letter-spacing: 0.01em;
    }
    .choice-btn.correct .choice-hint,
    .choice-btn.wrong .choice-hint { opacity: 0.85; }
    .choice-btn.correct {
      background: #29A9E1;
      border-color: #29A9E1;
      color: #ffffff;
      box-shadow: 4px 4px 0 #0f1a1f;
    }
    .choice-btn.wrong {
      background: #E13329;
      border-color: #E13329;
      color: #ffffff;
      box-shadow: 4px 4px 0 #0f1a1f;
    }
    .choice-btn.correct .choice-letter,
    .choice-btn.wrong .choice-letter { background: #ffffff; }
    .choice-btn.correct .choice-letter { color: #29A9E1; }
    .choice-btn.wrong .choice-letter { color: #E13329; }
    .choice-btn.disabled {
      pointer-events: none;
      opacity: 0.35;
    }

    /* === DRAWER === */
    .drawer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #ffffff;
      border-top: 3px solid #0f1a1f;
      padding: 24px 20px;
      padding-bottom: max(28px, env(safe-area-inset-bottom));
      transform: translateY(110%);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 100;
      max-width: 480px;
      margin: 0 auto;
      border-radius: 4px 4px 0 0;
      max-height: 85dvh;
      display: flex;
      flex-direction: column;
      pointer-events: none;
    }
    .drawer.open {
      transform: translateY(0);
      pointer-events: auto;
    }
    .drawer-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 16px;
    }
    .drawer-status {
      font-weight: 700;
      font-size: 22px;
      color: #0f1a1f;
      margin-bottom: 12px;
    }
    .drawer-explain {
      font-weight: 500;
      font-size: 16px;
      line-height: 1.6;
      color: #0f1a1f;
      margin: 0 0 20px;
    }
    .drawer-explain b {
      color: #29A9E1;
      font-weight: 800;
    }

    /* === CONFETTI === */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 200;
    }

    /* === BUTTONS === */
    .btn-primary {
      width: 100%;
      padding: 18px;
      background: #29A9E1;
      border: 3px solid #ffffff;
      box-shadow: 4px 4px 0 #ffffff;
      border-radius: 4px;
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-primary:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #ffffff;
    }
    .btn-primary.btn-dark {
      border-color: #0f1a1f;
      box-shadow: 4px 4px 0 #0f1a1f;
    }
    .btn-primary.btn-dark:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #0f1a1f;
    }
    .btn-ghost {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.55);
      font-size: 16px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
    }
    .btn-ghost:active { color: #ffffff; }

    /* === RESULT === */
    .result-inner {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .score-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }
    .score-number {
      display: inline-block;
      font-weight: 900;
      font-size: 96px;
      line-height: 1;
      color: #ffffff;
      letter-spacing: -0.03em;
    }
    .score-label {
      font-weight: 600;
      font-size: 24px;
      color: rgba(255,255,255,0.6);
      margin-top: 4px;
    }
    .result-dots {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin: 8px 0 24px;
    }
    .dot {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      margin: 4px;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.25);
    }
    .dot.correct { background: #29A9E1; border-color: #29A9E1; }
    .dot.wrong { background: #E13329; border-color: #E13329; }
    .result-phrase {
      font-weight: 600;
      font-size: 20px;
      line-height: 1.4;
      color: #ffffff;
      text-align: center;
      margin: 0 0 32px;
      padding: 0 8px;
    }

    /* === ANIMATIONS === */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%      { transform: translateX(-8px); }
      40%      { transform: translateX(8px); }
      60%      { transform: translateX(-5px); }
      80%      { transform: translateX(5px); }
    }
    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.02); }
      100% { transform: scale(1); }
    }
    @keyframes countUp {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }

    .animate-in { animation: fadeInUp 0.35s ease forwards; }
    .card.shake { animation: shake 0.4s ease; }
    .card.pulse { animation: pulse 0.3s ease; }
  </style>
</head>
<body>

  <!-- HOME / MODULE SELECT -->
  <div class="screen screen-home">
    <div class="home-inner">
      <img class="start-hero" src="hero.png" alt="" />
      <h1>Обучение AI</h1>
      <p>Выбери модуль и закрепи материал. Каждый — короткая интерактивная игра.</p>
      <div class="module-list" id="module-list"></div>
    </div>
  </div>

  <!-- GAME -->
  <div class="screen screen-game" style="display:none">
    <div class="game-inner">
      <button class="back-link" onclick="backToModules()">← К модулям</button>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-label" id="progress-label">1 / 10</div>

      <div class="card" id="task-card">
        <div class="task-head">
          <span class="task-badge" id="task-badge">ЗАДАЧА</span>
          <span class="task-icon" id="task-icon" style="display:none"></span>
        </div>
        <div class="task-quote" id="task-quote" style="display:none">
          <span class="quote-label">✍️ Промт</span>
          <span class="quote-text" id="quote-text"></span>
        </div>
        <p class="task-text" id="task-text"></p>
      </div>

      <div class="choices" id="choices"></div>
    </div>

    <div class="drawer" id="drawer">
      <div class="drawer-scroll">
        <div class="drawer-status" id="drawer-status"></div>
        <p class="drawer-explain" id="drawer-explain"></p>
      </div>
      <button class="btn-primary btn-dark" onclick="nextCase()">Дальше →</button>
    </div>
  </div>

  <!-- RESULT -->
  <div class="screen screen-result" style="display:none">
    <div class="result-inner">
      <div class="score-block">
        <span class="score-number" id="score-number">0</span>
        <span class="score-label" id="score-label">из 10</span>
      </div>
      <div class="result-dots" id="result-dots"></div>
      <p class="result-phrase" id="result-phrase"></p>
      <button class="btn-primary" onclick="restartModule()">Сыграть ещё раз</button>
      <button class="btn-ghost" onclick="backToModules()">К модулям</button>
    </div>
  </div>

  <script>
    // ============================================================
    // МОДУЛИ
    // ============================================================
    const MODULES = [
      {
        id: "m1",
        badge: "Модуль 1",
        title: "AI или не AI?",
        desc: "Кто справится с задачей: полностью ИИ, ты или вы вместе.",
        meta: "10 вопросов · стратегии",
        taskBadge: "ЗАДАЧА",
        wrongLabel: "Не совсем",
        pickCount: 10,
        shuffleOptions: false,
        sharedOptions: [
          { id: "ai",       text: "AI",     emoji: "🤖", hint: "Полностью ИИ" },
          { id: "me",       text: "Я",      emoji: "🧠", hint: "Полностью я" },
          { id: "together", text: "Вместе", emoji: "🤝", hint: "Я + ИИ" }
        ],
        resultPhrase: function(score) {
          if (score <= 3) return "AI пока работает без тебя. Пора познакомиться 👋";
          if (score <= 5) return "Неплохое начало. Но ты ещё оставляешь AI без работы";
          if (score <= 7) return "Ты думаешь правильно. Осталось довести до автопилота";
          if (score <= 9) return "Сильно. Ты уже работаешь как киборг 🤖";
          return "Идеально. Либо читал конспект, либо уже живёшь в будущем ⚡";
        },
        questions: [
          { task: "Законспектировать Zoom-созвон с командой на 1 час", correct: "ai", explain: "<b>NotebookLM</b> делает это за 2 минуты. Классическая рутина — настроил один раз, забыл." },
          { task: "Написать первый ответ недовольному клиенту", correct: "together", explain: "AI пишет черновик, ты корректируешь тон. Отношения с клиентом — твоя территория." },
          { task: "Решить: уволить ли менеджера после плохого квартала", correct: "me", explain: "AI может структурировать аргументы, но решение про человека — только твоё. Всегда." },
          { task: "Найти 5 поставщиков мебели в Европе по параметрам проекта", correct: "ai", explain: "<b>Perplexity</b> ищет с источниками, фильтрует по стилю и размерам. Ты только смотришь результат." },
          { task: "Подготовить черновик бизнес-кейса для инвестора", correct: "together", explain: "AI строит структуру и первый драфт, ты добавляешь цифры и стратегию." },
          { task: "Посчитать точную юнит-экономику продукта", correct: "together", explain: "AI помогает со структурой, но все цифры проверяешь сам. AI галлюцинирует в математике." },
          { task: "Готовить каждое утро дайджест по рынку фитнеса", correct: "ai", explain: "Настроил <b>Perplexity</b> один раз — получаешь дайджест автоматически каждое утро." },
          { task: "Придумать стратегию выхода в новый город", correct: "together", explain: "AI как компаньон: ты накидываешь идеи, он подсвечивает слабые места и предлагает альтернативы." },
          { task: "Составить ведомость материалов из PDF-планов квартиры", correct: "ai", explain: "Загружаешь PDF — получаешь таблицу с позициями и габаритами. Ты проверяешь глазом эксперта." },
          { task: "Написать регламент работы для нового сотрудника", correct: "together", explain: "AI собирает черновик из расшифровок созвонов и онбординг-сессий. Но политику компании, рамки и тонкости команды добавляешь сам — это твоя зона." },
          { task: "Подретушировать фото с корпоратива для соцсетей — на нём уставший вид", correct: "ai", explain: "Закидываешь в <b>ChatGPT</b> — он уберёт усталость, добавит свет. Или используешь личного ИИ-ретушёра (custom GPT) под свой стиль." },
          { task: "Набросать сложное голосовое сообщение партнёру", correct: "together", explain: "Диктуешь мысли в <b>Wispr Flow</b>, <b>ChatGPT</b> структурирует и подсвечивает слабые места. Финальное голосовое записываешь сам — звучит по-человечески." },
          { task: "Разобрать контракт на 40 страниц за час до встречи", correct: "ai", explain: "Загружаешь в <b>Claude</b> — за минуту получаешь ключевые условия и красные флаги. К встрече готов." },
          { task: "Придумать название новому продукту — идей ноль", correct: "together", explain: "AI генерирует 50 вариантов за минуту по твоим критериям. Ты выбираешь и докручиваешь лучшие." },
          { task: "Зафиксировать бизнес-идею прямо в такси, чтобы не потерять", correct: "ai", explain: "Открываешь <b>Wispr Flow</b>, надиктовываешь голосом — <b>ChatGPT</b> мгновенно превращает в структурированную заметку. Идея зафиксирована." },
          { task: "Ответить по делу на отчёт сотрудника на 3 страницы", correct: "together", explain: "AI суммаризирует отчёт и предлагает 3 варианта ответа. Ты выбираешь тон и отправляешь." },

          ], correct: 0, explain: "Создать <b>Project</b> = папка + инструкция обычным языком + загрузить файлы. Никакого кода. Если умеешь писать промт — умеешь настроить Project." },

          { task: "В Claude Project можно написать «отвечай только на основе загруженных файлов» — и он не будет придумывать от себя?", options: [
            { text: "Нет — это работает только в Custom GPT" },
            { text: "Нет — Claude всё равно использует общие знания" },
            { text: "Да — инструкция в Project работает как правило для всех чатов внутри него" },
            { text: "Да, но только на платном тарифе" }
          ], correct: 2, explain: "Системная инструкция <b>Project</b> задаёт правила для всех чатов внутри. Напиши «используй только загруженные документы» — Claude будет придерживаться этого. Это делает его надёжным корпоративным ассистентом." },

          { task: "Лучшая связка для работы с большими объёмами информации:", options: [
            { text: "ChatGPT для всего — универсальный инструмент" },
            { text: "Использовать только NotebookLM — он справляется со всем" },
            { text: "Загрузить всё напрямую в Claude и не мудрить" },
            { text: "Собрать и синтезировать в NotebookLM → перенести в Claude Project для глубокой работы" }
          ], correct: 3, explain: "<b>NotebookLM</b> = быстро собрать сотни источников, синтез. <b>Claude Project</b> = взять готовую выжимку и сделать с ней глубокую работу — написать, проанализировать, принять решение. Вместе — намного мощнее, чем каждый по отдельности." }
        ]
      }
    ];

    // ============================================================
    // ТЕМАТИЧЕСКИЕ ИКОНКИ М2 (по порядку вопросов)
    // ============================================================
    const M2_ICONS = ["✍️","🧱","😈","🧩","❓","🌫️","📋","🧒","📣","🪄","⚙️","🧠","📁","🚗","📏","🤖","🔧","📚","🔁","🦾","📓","🎧","⚖️","🗄️","📄","🗂️","☕","🙌","🔒","🔗"];
    (function () {
      const m2 = MODULES.find(m => m.id === 'm2');
      m2.questions.forEach((q, i) => { q.icon = M2_ICONS[i]; });
    })();

    // ============================================================
    // СОСТОЯНИЕ
    // ============================================================
    let currentModule = null;
    let gameCases = [];
    let currentIndex = 0;
    let score = 0;
    let answered = false;
    let answerLog = [];

    // ============================================================
    // SHUFFLE
    // ============================================================
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // ============================================================
    // ВЫБОР МОДУЛЯ
    // ============================================================
    function renderModuleSelect() {
      const list = document.getElementById('module-list');
      list.innerHTML = '';
      MODULES.forEach(m => {
        const card = document.createElement('button');
        card.className = 'module-card';
        card.innerHTML =
          `<span class="module-badge">${m.badge}</span>` +
          `<span class="module-title">${m.title}</span>` +
          `<span class="module-desc">${m.desc}</span>` +
          `<span class="module-meta">${m.meta} →</span>`;
        card.addEventListener('click', () => startModule(m.id));
        list.appendChild(card);
      });
    }

    // ============================================================
    // СБОРКА РАУНДА
    // ============================================================
    function buildRound(module) {
      const picked = shuffle(module.questions).slice(0, module.pickCount);
      return picked.map(q => {
        let options = (q.options ? q.options : module.sharedOptions).map(o => ({ ...o }));
        let correctIndex = (typeof q.correct === 'number')
          ? q.correct
          : options.findIndex(o => o.id === q.correct);
        if (module.shuffleOptions) {
          const correctOpt = options[correctIndex];
          options = shuffle(options);
          correctIndex = options.indexOf(correctOpt);
        }
        return { quote: q.quote || null, icon: q.icon || null, task: q.task, options, correctIndex, explain: q.explain };
      });
    }

    // ============================================================
    // СТАРТ МОДУЛЯ
    // ============================================================
    function startModule(id) {
      currentModule = MODULES.find(m => m.id === id);
      if (!currentModule) return;
      gameCases = buildRound(currentModule);
      currentIndex = 0;
      score = 0;
      answerLog = [];
      document.getElementById('score-label').textContent = 'из ' + gameCases.length;
      showScreen('game');
      showCase();
    }

    function restartModule() {
      if (currentModule) startModule(currentModule.id);
    }

    function backToModules() {
      closeDrawer();
      showScreen('home');
    }

    // ============================================================
    // ПОКАЗАТЬ КЕЙС
    // ============================================================
    function showCase() {
      answered = false;
      closeDrawer();
      window.scrollTo(0, 0);
      requestAnimationFrame(() => window.scrollTo(0, 0));

      const c = gameCases[currentIndex];
      const total = gameCases.length;

      document.getElementById('progress-fill').style.width = (currentIndex / total * 100) + '%';
      document.getElementById('progress-label').textContent = (currentIndex + 1) + ' / ' + total;
      document.getElementById('task-badge').textContent = currentModule.taskBadge;

      const iconEl = document.getElementById('task-icon');
      if (c.icon) {
        iconEl.style.display = 'block';
        iconEl.textContent = c.icon;
      } else {
        iconEl.style.display = 'none';
      }

      const quoteEl = document.getElementById('task-quote');
      if (c.quote) {
        quoteEl.style.display = 'block';
        document.getElementById('quote-text').textContent = '«' + c.quote + '»';
      } else {
        quoteEl.style.display = 'none';
      }

      document.getElementById('task-text').textContent = c.task;

      const choicesEl = document.getElementById('choices');
      choicesEl.innerHTML = '';
      c.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn' + (opt.emoji ? '' : ' choice-btn--letter');
        btn.setAttribute('data-index', i);
        const left = opt.emoji
          ? `<span class="choice-emoji">${opt.emoji}</span>`
          : `<span class="choice-letter">${String.fromCharCode(65 + i)}</span>`;
        const textNode = document.createElement('span');
        textNode.className = 'choice-text';
        textNode.textContent = opt.text;
        const body = document.createElement('span');
        body.className = 'choice-body';
        body.appendChild(textNode);
        if (opt.hint) {
          const hintNode = document.createElement('span');
          hintNode.className = 'choice-hint';
          hintNode.textContent = opt.hint;
          body.appendChild(hintNode);
        }
        btn.innerHTML = left;
        btn.appendChild(body);
        btn.addEventListener('click', () => handleAnswer(i));
        choicesEl.appendChild(btn);
      });

      const card = document.getElementById('task-card');
      card.classList.remove('animate-in');
      void card.offsetWidth;
      card.classList.add('animate-in');
    }

    // ============================================================
    // КЛИК НА ОТВЕТ
    // ============================================================
    function handleAnswer(index) {
      if (answered) return;
      answered = true;

      const c = gameCases[currentIndex];
      const isCorrect = index === c.correctIndex;

      if (navigator.vibrate) navigator.vibrate(isCorrect ? 15 : [30, 40, 30]);

      document.querySelectorAll('.choice-btn').forEach(btn => btn.classList.add('disabled'));

      const chosenBtn = document.querySelector(`.choice-btn[data-index="${index}"]`);
      chosenBtn.classList.remove('disabled');
      chosenBtn.classList.add(isCorrect ? 'correct' : 'wrong');

      if (!isCorrect) {
        const correctBtn = document.querySelector(`.choice-btn[data-index="${c.correctIndex}"]`);
        correctBtn.classList.remove('disabled');
        correctBtn.classList.add('correct');
      }

      const card = document.getElementById('task-card');
      card.classList.add(isCorrect ? 'pulse' : 'shake');
      setTimeout(() => card.classList.remove('pulse', 'shake'), 500);

      if (isCorrect) score++;
      answerLog.push(isCorrect);

      document.getElementById('progress-fill').style.width = ((currentIndex + 1) / gameCases.length * 100) + '%';

      setTimeout(() => openDrawer(isCorrect, c.explain), 280);
    }

    // ============================================================
    // DRAWER
    // ============================================================
    function openDrawer(isCorrect, explain) {
      const drawer = document.getElementById('drawer');
      document.getElementById('drawer-status').textContent = isCorrect ? '✅ Правильно!' : '❌ ' + currentModule.wrongLabel;
      document.getElementById('drawer-explain').innerHTML = explain;
      const scroll = drawer.querySelector('.drawer-scroll');
      if (scroll) scroll.scrollTop = 0;
      drawer.classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('drawer').classList.remove('open');
    }

    // ============================================================
    // СЛЕДУЮЩИЙ КЕЙС
    // ============================================================
    function nextCase() {
      currentIndex++;
      if (currentIndex < gameCases.length) {
        showCase();
      } else {
        showResult();
      }
    }

    // ============================================================
    // КОНФЕТТИ
    // ============================================================
    function launchConfetti() {
      const canvas = document.createElement('canvas');
      canvas.id = 'confetti-canvas';
      document.body.appendChild(canvas);
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);

      const W = window.innerWidth;
      const H = window.innerHeight;
      const colors = ['#29A9E1', '#E13329', '#ffffff', '#29A9E1'];
      const particles = [];
      const count = 90;

      for (let i = 0; i < count; i++) {
        particles.push({
          x: W / 2 + (Math.random() - 0.5) * 80,
          y: H / 3,
          vx: (Math.random() - 0.5) * 16,
          vy: Math.random() * -16 - 6,
          size: Math.random() * 6 + 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * Math.PI * 2,
          vr: (Math.random() - 0.5) * 0.35
        });
      }

      function tick() {
        ctx.clearRect(0, 0, W, H);
        let alive = 0;
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.45;
          p.vx *= 0.99;
          p.rot += p.vr;
          if (p.y < H + 40) alive++;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size, -p.size / 2, p.size * 2, p.size);
          ctx.restore();
        });
        if (alive > 0) requestAnimationFrame(tick);
        else canvas.remove();
      }
      requestAnimationFrame(tick);
    }

    // ============================================================
    // РЕЗУЛЬТАТ
    // ============================================================
    function showResult() {
      showScreen('result');

      const total = gameCases.length;
      const scoreEl = document.getElementById('score-number');
      scoreEl.style.animation = 'none';
      void scoreEl.offsetWidth;
      scoreEl.style.animation = 'countUp 0.6s cubic-bezier(0.22,1,0.36,1) forwards';

      const duration = 600;
      const start = performance.now();
      function tick(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        scoreEl.textContent = Math.round(eased * score);
        if (t < 1) requestAnimationFrame(tick);
        else scoreEl.textContent = score;
      }
      requestAnimationFrame(tick);

      const dotsEl = document.getElementById('result-dots');
      dotsEl.innerHTML = '';
      answerLog.forEach(ok => {
        const dot = document.createElement('span');
        dot.className = 'dot ' + (ok ? 'correct' : 'wrong');
        dotsEl.appendChild(dot);
      });

      document.getElementById('result-phrase').textContent = currentModule.resultPhrase(score);

      if (score >= Math.ceil(total * 0.8)) {
        setTimeout(launchConfetti, 350);
        if (navigator.vibrate) navigator.vibrate([40, 60, 80]);
      }
    }

    // ============================================================
    // ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ
    // ============================================================
    function showScreen(name) {
      document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
      const target = document.querySelector(`.screen-${name}`);
      target.style.display = 'flex';
      window.scrollTo(0, 0);
    }

    // ============================================================
    // ИНИЦИАЛИЗАЦИЯ + DEEP LINK ?module=1|2
    // ============================================================
    function init() {
      renderModuleSelect();
      const param = new URLSearchParams(location.search).get('module');
      if (param) {
        const m = MODULES.find(x => x.id === param || x.id === 'm' + param);
        if (m) { startModule(m.id); return; }
      }
      showScreen('home');
    }

    init();
  </script>
</body>
</html>
