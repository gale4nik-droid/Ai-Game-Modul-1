<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI или не AI?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* === BASE === */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --dark:  #0f1a1f;
      --white: #ffffff;
      --blue:  #29A9E1;
      --red:   #E13329;
    }

    html, body { height: 100%; }

    body {
      background-color: #0f1a1f;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button {
      font-family: 'Inter', sans-serif;
    }

    /* === SCREENS === */
    .screen {
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
    }
    .screen-start,
    .screen-result {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .screen-game {
      display: flex;
      flex-direction: column;
      padding: 20px 20px 24px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* === START SCREEN === */
    .start-inner {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .start-hero {
      display: block;
      width: 100%;
      max-width: 260px;
      height: auto;
      margin: 0 auto 24px;
      animation: gentleFloat 6s ease-in-out infinite;
      filter: drop-shadow(0 0 32px rgba(41, 169, 225, 0.3));
    }
    .start-inner h1 {
      font-weight: 900;
      font-size: 40px;
      line-height: 1.1;
      color: #ffffff;
      margin: 0 0 16px;
      letter-spacing: -0.02em;
    }
    .start-inner p {
      font-weight: 500;
      font-size: 18px;
      line-height: 1.4;
      color: rgba(255,255,255,0.7);
      margin: 0 0 32px;
    }

    /* === PROGRESS === */
    .progress-track {
      height: 6px;
      background: rgba(255,255,255,0.15);
      border-radius: 0;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #29A9E1;
      transition: width 0.4s ease;
    }
    .progress-label {
      font-weight: 500;
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      text-align: right;
      margin-bottom: 20px;
    }

    /* === CARD === */
    .card {
      background: #ffffff;
      border: 3px solid #0f1a1f;
      box-shadow: 8px 8px 0 #0f1a1f;
      border-radius: 4px;
      padding: 28px 24px;
      margin-bottom: 24px;
    }
    .task-badge {
      display: inline-block;
      background: #29A9E1;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      border-radius: 2px;
      margin-bottom: 16px;
    }
    .task-text {
      font-weight: 600;
      font-size: 20px;
      line-height: 1.5;
      color: #0f1a1f;
      margin: 0;
    }

    /* === CHOICES === */
    .choices {
      display: flex;
      flex-direction: column;
    }
    .choice-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 56px;
      padding: 18px 20px;
      background: #ffffff;
      border: 3px solid #0f1a1f;
      box-shadow: 4px 4px 0 #0f1a1f;
      border-radius: 4px;
      font-size: 18px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      color: #0f1a1f;
      margin-bottom: 12px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s, background 0.15s, color 0.15s, border-color 0.15s;
      text-align: left;
    }
    .choice-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #0f1a1f;
    }
    .choice-emoji {
      font-size: 24px;
      line-height: 1;
      flex-shrink: 0;
    }
    .choice-body {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      line-height: 1.2;
    }
    .choice-text {
      font-size: 18px;
      font-weight: 700;
    }
    .choice-hint {
      font-size: 12px;
      font-weight: 500;
      opacity: 0.55;
      letter-spacing: 0.01em;
    }
    .choice-btn.correct .choice-hint,
    .choice-btn.wrong .choice-hint {
      opacity: 0.85;
    }
    .choice-btn.correct {
      background: #29A9E1;
      border-color: #29A9E1;
      color: #ffffff;
      box-shadow: 4px 4px 0 #0f1a1f;
    }
    .choice-btn.wrong {
      background: #E13329;
      border-color: #E13329;
      color: #ffffff;
      box-shadow: 4px 4px 0 #0f1a1f;
    }
    .choice-btn.disabled {
      pointer-events: none;
      opacity: 0.35;
    }

    /* === DRAWER === */
    .drawer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #ffffff;
      border-top: 3px solid #0f1a1f;
      padding: 24px 20px 40px;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 100;
      max-width: 480px;
      margin: 0 auto;
      border-radius: 4px 4px 0 0;
    }
    .drawer.open {
      transform: translateY(0);
    }
    .drawer-status {
      font-weight: 700;
      font-size: 22px;
      color: #0f1a1f;
      margin-bottom: 12px;
    }
    .drawer-explain {
      font-weight: 500;
      font-size: 16px;
      line-height: 1.6;
      color: #0f1a1f;
      margin: 0 0 20px;
    }
    .drawer-explain b {
      color: #29A9E1;
      font-weight: 800;
    }

    /* === CONFETTI === */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 200;
    }

    /* === PRIMARY BUTTON === */
    .btn-primary {
      width: 100%;
      padding: 18px;
      background: #29A9E1;
      border: 3px solid #ffffff;
      box-shadow: 4px 4px 0 #ffffff;
      border-radius: 4px;
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-primary:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #ffffff;
    }
    .btn-primary.btn-dark {
      border-color: #0f1a1f;
      box-shadow: 4px 4px 0 #0f1a1f;
    }
    .btn-primary.btn-dark:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #0f1a1f;
    }

    /* === RESULT === */
    .result-inner {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .score-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }
    .score-number {
      display: inline-block;
      font-weight: 900;
      font-size: 96px;
      line-height: 1;
      color: #ffffff;
      letter-spacing: -0.03em;
    }
    .score-label {
      font-weight: 600;
      font-size: 24px;
      color: rgba(255,255,255,0.6);
      margin-top: 4px;
    }
    .result-dots {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin: 8px 0 24px;
    }
    .dot {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      margin: 4px;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.25);
    }
    .dot.correct {
      background: #29A9E1;
      border-color: #29A9E1;
    }
    .dot.wrong {
      background: #E13329;
      border-color: #E13329;
    }
    .result-phrase {
      font-weight: 600;
      font-size: 20px;
      line-height: 1.4;
      color: #ffffff;
      text-align: center;
      margin: 0 0 32px;
      padding: 0 8px;
    }

    /* === ANIMATIONS === */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%      { transform: translateX(-8px); }
      40%      { transform: translateX(8px); }
      60%      { transform: translateX(-5px); }
      80%      { transform: translateX(5px); }
    }
    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.02); }
      100% { transform: scale(1); }
    }
    @keyframes countUp {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }

    .animate-in { animation: fadeInUp 0.35s ease forwards; }
    .card.shake { animation: shake 0.4s ease; }
    .card.pulse { animation: pulse 0.3s ease; }
  </style>
</head>
<body>

  <!-- START -->
  <div class="screen screen-start">
    <div class="start-inner">
      <img class="start-hero" src="hero.png" alt="" />
      <h1>AI или не AI?</h1>
      <p>10 задач. Для каждой выбери, кто справится лучше: <b>полностью ИИ</b>, <b>полностью ты</b> или <b>вы вместе</b>.</p>
      <button class="btn-primary" onclick="startGame()">Поехали →</button>
    </div>
  </div>

  <!-- GAME -->
  <div class="screen screen-game" style="display:none">
    <div class="game-inner">
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-label" id="progress-label">1 / 10</div>

      <div class="card" id="task-card">
        <span class="task-badge">ЗАДАЧА</span>
        <p class="task-text" id="task-text"></p>
      </div>

      <div class="choices" id="choices"></div>
    </div>

    <div class="drawer" id="drawer">
      <div class="drawer-status" id="drawer-status"></div>
      <p class="drawer-explain" id="drawer-explain"></p>
      <button class="btn-primary btn-dark" onclick="nextCase()">Дальше →</button>
    </div>
  </div>

  <!-- RESULT -->
  <div class="screen screen-result" style="display:none">
    <div class="result-inner">
      <div class="score-block">
        <span class="score-number" id="score-number">0</span>
        <span class="score-label">из 10</span>
      </div>
      <div class="result-dots" id="result-dots"></div>
      <p class="result-phrase" id="result-phrase"></p>
      <button class="btn-primary" onclick="startGame()">Сыграть ещё раз</button>
    </div>
  </div>

  <script>
    // ============================================================
    // ДАННЫЕ
    // ============================================================
    const allCases = [
      {
        task: "Законспектировать Zoom-созвон с командой на 1 час",
        correct: "ai",
        explain: "<b>NotebookLM</b> делает это за 2 минуты. Классическая рутина — настроил один раз, забыл."
      },
      {
        task: "Написать первый ответ недовольному клиенту",
        correct: "together",
        explain: "AI пишет черновик, ты корректируешь тон. Отношения с клиентом — твоя территория."
      },
      {
        task: "Решить: уволить ли менеджера после плохого квартала",
        correct: "me",
        explain: "AI может структурировать аргументы, но решение про человека — только твоё. Всегда."
      },
      {
        task: "Найти 5 поставщиков мебели в Европе по параметрам проекта",
        correct: "ai",
        explain: "<b>Perplexity</b> ищет с источниками, фильтрует по стилю и размерам. Ты только смотришь результат."
      },
      {
        task: "Подготовить черновик бизнес-кейса для инвестора",
        correct: "together",
        explain: "AI строит структуру и первый драфт, ты добавляешь цифры и стратегию."
      },
      {
        task: "Посчитать точную юнит-экономику продукта",
        correct: "together",
        explain: "AI помогает со структурой, но все цифры проверяешь сам. AI галлюцинирует в математике."
      },
      {
        task: "Готовить каждое утро дайджест по рынку фитнеса",
        correct: "ai",
        explain: "Настроил <b>Perplexity</b> один раз — получаешь дайджест автоматически каждое утро."
      },
      {
        task: "Придумать стратегию выхода в новый город",
        correct: "together",
        explain: "AI как компаньон: ты накидываешь идеи, он подсвечивает слабые места и предлагает альтернативы."
      },
      {
        task: "Составить ведомость материалов из PDF-планов квартиры",
        correct: "ai",
        explain: "Загружаешь PDF — получаешь таблицу с позициями и габаритами. Ты проверяешь глазом эксперта."
      },
      {
        task: "Написать регламент работы для нового сотрудника",
        correct: "together",
        explain: "AI собирает черновик из расшифровок созвонов и онбординг-сессий. Но политику компании, рамки и тонкости команды добавляешь сам — это твоя зона."
      },
      {
        task: "Подретушировать фото с корпоратива для соцсетей — на нём уставший вид",
        correct: "ai",
        explain: "Закидываешь в <b>ChatGPT</b> — он уберёт усталость, добавит свет. Или используешь личного ИИ-ретушёра (custom GPT) под свой стиль."
      },
      {
        task: "Набросать сложное голосовое сообщение партнёру",
        correct: "together",
        explain: "Диктуешь мысли в <b>Wispr Flow</b>, <b>ChatGPT</b> структурирует и подсвечивает слабые места. Финальное голосовое записываешь сам — звучит по-человечески."
      },
      {
        task: "Разобрать контракт на 40 страниц за час до встречи",
        correct: "ai",
        explain: "Загружаешь в <b>Claude</b> — за минуту получаешь ключевые условия и красные флаги. К встрече готов."
      },
      {
        task: "Придумать название новому продукту — идей ноль",
        correct: "together",
        explain: "AI генерирует 50 вариантов за минуту по твоим критериям. Ты выбираешь и докручиваешь лучшие."
      },
      {
        task: "Зафиксировать бизнес-идею прямо в такси, чтобы не потерять",
        correct: "ai",
        explain: "Открываешь <b>Wispr Flow</b>, надиктовываешь голосом — <b>ChatGPT</b> мгновенно превращает в структурированную заметку. Идея зафиксирована."
      },
      {
        task: "Ответить по делу на отчёт сотрудника на 3 страницы",
        correct: "together",
        explain: "AI суммаризирует отчёт и предлагает 3 варианта ответа. Ты выбираешь тон и отправляешь."
      },
      {
        task: "Сделать презентацию для клиента, пока дизайнер занят",
        correct: "ai",
        explain: "<b>Claude</b> строит структуру, <b>Gamma.app</b> делает визуал автоматически. За час — готовый черновик."
      },
      {
        task: "Быстро ответить на публичный негативный отзыв клиента",
        correct: "together",
        explain: "AI пишет 3 варианта в разном тоне. Ты выбираешь и добавляешь личное. Отправляешь сам — это репутация."
      },
      {
        task: "Собрать всё о конкуренте перед важными переговорами",
        correct: "ai",
        explain: "<b>Perplexity Deep Research</b> за 5 минут собирает всё: выручка, продукты, слабые места, последние новости."
      },
      {
        task: "Проверить тон важного сообщения партнёру перед отправкой",
        correct: "together",
        explain: "Вставляешь в <b>Claude</b>: «Как это звучит со стороны получателя?» Он укажет на острые углы до отправки."
      },
      {
        task: "Выгрузить большой поток мыслей и контекста по проекту",
        correct: "ai",
        explain: "Жмёшь микрофон в <b>ChatGPT</b> или открываешь <b>Wispr Flow</b> — наговариваешь поток сознания голосом. AI структурирует за минуту. Печатать в 4 раза дольше, а сотрудник переспрашивает и забывает детали."
      }
    ];

    // ============================================================
    // МАППИНГ
    // ============================================================
    const labels = {
      ai:       { text: "AI",     emoji: "🤖", hint: "Полностью ИИ" },
      me:       { text: "Я",      emoji: "🧠", hint: "Полностью я" },
      together: { text: "Вместе", emoji: "🤝", hint: "Я + ИИ" }
    };
    const choiceOrder = ["ai", "me", "together"];

    // ============================================================
    // ФРАЗЫ ПОД ИТОГ
    // ============================================================
    function getResultPhrase(score) {
      if (score <= 3) return "AI пока работает без тебя. Пора познакомиться 👋";
      if (score <= 5) return "Неплохое начало. Но ты ещё оставляешь AI без работы";
      if (score <= 7) return "Ты думаешь правильно. Осталось довести до автопилота";
      if (score <= 9) return "Сильно. Ты уже работаешь как киборг 🤖";
      return "Идеально. Либо читал конспект, либо уже живёшь в будущем ⚡";
    }

    // ============================================================
    // SHUFFLE
    // ============================================================
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // ============================================================
    // СОСТОЯНИЕ
    // ============================================================
    let gameCases = [];
    let currentIndex = 0;
    let score = 0;
    let answered = false;
    let answerLog = [];

    // ============================================================
    // СТАРТ
    // ============================================================
    function startGame() {
      gameCases = shuffle(allCases).slice(0, 10);
      currentIndex = 0;
      score = 0;
      answerLog = [];
      showScreen('game');
      showCase();
    }

    // ============================================================
    // ПОКАЗАТЬ КЕЙС
    // ============================================================
    function showCase() {
      answered = false;
      closeDrawer();
      window.scrollTo(0, 0);
      requestAnimationFrame(() => window.scrollTo(0, 0));

      const c = gameCases[currentIndex];
      const progress = (currentIndex / 10) * 100;

      document.getElementById('progress-fill').style.width = progress + '%';
      document.getElementById('progress-label').textContent = (currentIndex + 1) + ' / 10';
      document.getElementById('task-text').textContent = c.task;

      const choicesEl = document.getElementById('choices');
      choicesEl.innerHTML = '';
      choiceOrder.forEach(key => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.setAttribute('data-key', key);
        btn.innerHTML = `<span class="choice-emoji">${labels[key].emoji}</span><span class="choice-body"><span class="choice-text">${labels[key].text}</span><span class="choice-hint">${labels[key].hint}</span></span>`;
        btn.addEventListener('click', () => handleAnswer(key));
        choicesEl.appendChild(btn);
      });

      const card = document.getElementById('task-card');
      card.classList.remove('animate-in');
      // force reflow to restart animation
      void card.offsetWidth;
      card.classList.add('animate-in');
    }

    // ============================================================
    // КЛИК НА КНОПКУ
    // ============================================================
    function handleAnswer(chosen) {
      if (answered) return;
      answered = true;

      const correct = gameCases[currentIndex].correct;
      const isCorrect = chosen === correct;

      if (navigator.vibrate) navigator.vibrate(isCorrect ? 15 : [30, 40, 30]);

      document.querySelectorAll('.choice-btn').forEach(btn => {
        btn.classList.add('disabled');
      });

      const chosenBtn = document.querySelector(`.choice-btn[data-key="${chosen}"]`);
      chosenBtn.classList.remove('disabled');
      chosenBtn.classList.add(isCorrect ? 'correct' : 'wrong');

      if (!isCorrect) {
        const correctBtn = document.querySelector(`.choice-btn[data-key="${correct}"]`);
        correctBtn.classList.remove('disabled');
        correctBtn.classList.add('correct');
      }

      const card = document.getElementById('task-card');
      card.classList.add(isCorrect ? 'pulse' : 'shake');
      setTimeout(() => card.classList.remove('pulse', 'shake'), 500);

      if (isCorrect) score++;
      answerLog.push(isCorrect);

      const newProgress = ((currentIndex + 1) / 10) * 100;
      document.getElementById('progress-fill').style.width = newProgress + '%';

      setTimeout(() => {
        openDrawer(isCorrect, gameCases[currentIndex].explain);
      }, 350);
    }

    // ============================================================
    // DRAWER
    // ============================================================
    function openDrawer(isCorrect, explain) {
      const drawer = document.getElementById('drawer');
      document.getElementById('drawer-status').textContent = isCorrect ? '✅ Правильно!' : '❌ Не совсем';
      document.getElementById('drawer-explain').innerHTML = explain;
      drawer.classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('drawer').classList.remove('open');
    }

    // ============================================================
    // СЛЕДУЮЩИЙ КЕЙС
    // ============================================================
    function nextCase() {
      currentIndex++;
      if (currentIndex < 10) {
        showCase();
      } else {
        showResult();
      }
    }

    // ============================================================
    // КОНФЕТТИ
    // ============================================================
    function launchConfetti() {
      const canvas = document.createElement('canvas');
      canvas.id = 'confetti-canvas';
      document.body.appendChild(canvas);
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);

      const W = window.innerWidth;
      const H = window.innerHeight;
      const colors = ['#29A9E1', '#E13329', '#ffffff', '#29A9E1'];
      const particles = [];
      const count = 90;

      for (let i = 0; i < count; i++) {
        particles.push({
          x: W / 2 + (Math.random() - 0.5) * 80,
          y: H / 3,
          vx: (Math.random() - 0.5) * 16,
          vy: Math.random() * -16 - 6,
          size: Math.random() * 6 + 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * Math.PI * 2,
          vr: (Math.random() - 0.5) * 0.35,
          life: 0
        });
      }

      function tick() {
        ctx.clearRect(0, 0, W, H);
        let alive = 0;
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.45;
          p.vx *= 0.99;
          p.rot += p.vr;
          p.life++;
          if (p.y < H + 40) alive++;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size, -p.size / 2, p.size * 2, p.size);
          ctx.restore();
        });
        if (alive > 0) {
          requestAnimationFrame(tick);
        } else {
          canvas.remove();
        }
      }
      requestAnimationFrame(tick);
    }

    // ============================================================
    // РЕЗУЛЬТАТ
    // ============================================================
    function showResult() {
      showScreen('result');

      const scoreEl = document.getElementById('score-number');
      scoreEl.style.animation = 'none';
      void scoreEl.offsetWidth;
      scoreEl.style.animation = 'countUp 0.6s cubic-bezier(0.22,1,0.36,1) forwards';

      const duration = 600;
      const start = performance.now();
      function tick(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        scoreEl.textContent = Math.round(eased * score);
        if (t < 1) requestAnimationFrame(tick);
        else scoreEl.textContent = score;
      }
      requestAnimationFrame(tick);

      const dotsEl = document.getElementById('result-dots');
      dotsEl.innerHTML = '';
      answerLog.forEach(ok => {
        const dot = document.createElement('span');
        dot.className = 'dot ' + (ok ? 'correct' : 'wrong');
        dotsEl.appendChild(dot);
      });

      document.getElementById('result-phrase').textContent = getResultPhrase(score);

      if (score >= 8) {
        setTimeout(launchConfetti, 350);
        if (navigator.vibrate) navigator.vibrate([40, 60, 80]);
      }
    }

    // ============================================================
    // ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ
    // ============================================================
    function showScreen(name) {
      document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
      const target = document.querySelector(`.screen-${name}`);
      target.style.display = 'flex';
      window.scrollTo(0, 0);
    }
  </script>
</body>
